<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>"
    />
    <title>Wedding Quest 💍</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* iOS Safari resolves `height: 100%` against the viewport it has when
           the page loads, so once the address bar collapses the page keeps the
           old height and the game sits in a dark band. `dvh` tracks the toolbar;
           the `vh` above it is the fallback for browsers without `dvh`. */
        height: 100vh;
        height: 100dvh;
        background: #1a1423;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
